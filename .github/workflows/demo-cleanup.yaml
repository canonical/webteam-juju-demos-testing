name: Demo cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: canonical/webteam-devops/.github/workflows/demo-cleanup.yaml@5827cdf23746726d4dea2a7e80f0e57aba239aeb
    with:
      pr-number: ${{ github.event.pull_request.number }}
      api-url: ${{ vars.DEMOS_API_URL }}
      timeout-seconds: 600
      poll-interval-seconds: 5
    secrets:
      demos-api-token: ${{ secrets.DEMOS_API_TOKEN }}
