name: Demo deploy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: demo-deploy-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-reference: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify checkout and rock definition
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          ROCKCRAFT_PATH: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -f "${ROCKCRAFT_PATH}/rockcraft.yaml"

      - name: Validate and pack rock
        id: rockcraft
        uses: canonical/craft-actions/rockcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f # v0.1.1
        with:
          path: .
          verbosity: brief

      - name: Publish immutable PR image to GHCR
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROCK_FILE: ${{ steps.rockcraft.outputs.rock }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="pr-${PR_NUMBER}-sha-${COMMIT_SHA:0:12}"
          test -n "$ROCK_FILE"
          test -f "$ROCK_FILE"
          rockcraft.skopeo --insecure-policy copy \
            --dest-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "oci-archive:${ROCK_FILE}" "docker://${image_name}:${tag}"
          digest="$(
            rockcraft.skopeo --insecure-policy inspect \
              --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "docker://${image_name}:${tag}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])'
          )"
          test "${digest#sha256:}" != "$digest"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${image_name}@${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted API client
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Request deployment and wait for readiness
        id: deploy-api
        continue-on-error: true
        shell: bash
        env:
          API_URL: ${{ vars.DEMOS_API_URL }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DEMOS_HMAC_KEY: ${{ secrets.DEMOS_HMAC_KEY }}
          IMAGE_REFERENCE: ${{ needs.build.outputs.image-reference }}
          POLL_INTERVAL: 10
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TIMEOUT_SECONDS: 1200
        run: |
          python3 .github/scripts/demo_api.py \
            --api-url "$API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --timeout "$TIMEOUT_SECONDS" \
            --interval "$POLL_INTERVAL" \
            deploy \
            --commit-sha "$COMMIT_SHA" \
            --image "$IMAGE_REFERENCE" \
            --delivery-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-deploy"

      - name: Update persistent PR comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          API_MESSAGE: ${{ steps.deploy-api.outputs.message }}
          API_STATE: ${{ steps.deploy-api.outputs.state }}
          DEMO_URL: ${{ steps.deploy-api.outputs.demo_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy-api.outcome }}
          IMAGE_REFERENCE: ${{ needs.build.outputs.image-reference }}
          MARKER: <!-- demos-controller:${{ github.repository }}:${{ github.event.pull_request.number }} -->
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = process.env.MARKER;
            const succeeded = process.env.DEPLOY_OUTCOME === "success";
            const state = process.env.API_STATE || (succeeded ? "ready" : "failed");
            const details = process.env.API_MESSAGE ||
              (succeeded ? "The controller reports that the demo is ready." :
                "The workflow failed before the controller reported a final status.");
            const link = process.env.DEMO_URL
              ? `\n\n**Demo:** ${process.env.DEMO_URL}`
              : "";
            const image = process.env.IMAGE_REFERENCE
              ? `\n\n**Image:** \`${process.env.IMAGE_REFERENCE}\``
              : "";
            const body = `${marker}\n## PR demo: ${state}\n\n${details}${link}${image}` +
              `\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number("${{ github.event.pull_request.number }}"),
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number("${{ github.event.pull_request.number }}"),
                body,
              });
            }

      - name: Fail when deployment did not complete
        if: ${{ steps.deploy-api.outcome == 'failure' }}
        shell: bash
        run: exit 1
