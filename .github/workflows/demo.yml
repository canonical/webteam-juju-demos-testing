name: Demo
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
permissions:
  pull-requests: write
  packages: write

# Ensure only one demo runs at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Demo
    runs-on: [self-hosted, self-hosted-linux-amd64-noble-private-endpoint-medium]
    env:
      DEMOS_JUJU_CLIENT_ID: ${{ secrets.DEMOS_JUJU_CLIENT_ID }}
      DEMOS_JUJU_CLIENT_SECRET: ${{ secrets.DEMOS_JUJU_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Get demo ID
        id: demo-id
        run: echo "id=${{ github.event.repository.name }}-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Post pending comment
        uses: ./.github/actions/demo-comment
        with:
          demo-id: ${{ steps.demo-id.outputs.id }}
          status: pending
          run-id: ${{ github.run_id }}

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Setup charmcraft
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Cache rock
        id: cache-rock
        uses: actions/cache@v4
        with:
          path: "*.rock"
          key: rock-${{ hashFiles('rockcraft.yaml', 'app.py', 'requirements.txt') }}

      - name: Pack rock
        if: steps.cache-rock.outputs.cache-hit != 'true'
        run: rockcraft pack

      - name: Cache charm
        id: cache-charm
        uses: actions/cache@v4
        with:
          path: "charm/*.charm"
          key: charm-${{ hashFiles('charm/**') }}

      - name: Pack charm
        if: steps.cache-charm.outputs.cache-hit != 'true'
        run: |
          cd charm
          charmcraft pack -v
      
      - name: Set image URL
        id: image-url
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "url=ghcr.io/${REPO_LOWER}:${{ steps.demo-id.outputs.id }}" >> "$GITHUB_OUTPUT"
      
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Push rock to GHCR
        run: |
          ROCK_FILE=$(ls *.rock)
          rockcraft.skopeo --insecure-policy copy oci-archive:$ROCK_FILE docker://${{ steps.image-url.outputs.url }} --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
      
      - name: Install Juju
        run: sudo snap install juju
      
      - name: Authenticate with JAAS
        env:
          JUJU_CLIENT_ID: ${{ secrets.DEMOS_JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.DEMOS_JUJU_CLIENT_SECRET }}
        run: juju login jaas.ps7.canonical.com:443/k8s-jaas-ps7-jimm-jimm -c jaas-ps7
      
      - name: Deploy charm
        env:
          JUJU_CLIENT_ID: ${{ secrets.DEMOS_JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.DEMOS_JUJU_CLIENT_SECRET }}
        run: |
          CHARM_FILE=$(ls charm/*.charm)
          MODEL="795798e4-922f-49c7-9169-004ffc17df90@serviceaccount/k8s-webteam-demos-default"
          if juju show-application ${{ steps.demo-id.outputs.id }} -m "$MODEL" &>/dev/null; then
            juju refresh --debug ${{ steps.demo-id.outputs.id }} \
              --path="./$CHARM_FILE" \
              --resource flask-app-image=${{ steps.image-url.outputs.url }} \
              -m "$MODEL"
          else
            juju deploy --debug "./$CHARM_FILE" ${{ steps.demo-id.outputs.id }} \
              --resource flask-app-image=${{ steps.image-url.outputs.url }} \
              -m "$MODEL"
          fi

      - uses: hashicorp/setup-terraform@v3

      - name: Write Terraform base config
        run: |
          cat > terraform/demo/_base.tf << 'EOF'
          terraform {
            required_providers {
              juju = {
                source  = "juju/juju"
                version = "~> 1.1.0"
              }
            }
            backend "s3" {
              bucket = "webteam-demos-ps7-tfstate"
              region = "prodstack7"
              endpoints = {
                s3 = "https://radosgw.ps7.canonical.com"
              }
              skip_region_validation      = true
              skip_credentials_validation = true
              skip_requesting_account_id  = true
              skip_s3_checksum            = true
              use_path_style              = true
              use_lockfile                = true
            }
          }

          # Credentials via JUJU_CLIENT_ID and JUJU_CLIENT_SECRET environment variables.
          provider "juju" {
            controller_addresses = "jaas.ps7.canonical.com:443/k8s-jaas-ps7-jimm-jimm"
          }

          data "juju_model" "demos" {
            owner = "795798e4-922f-49c7-9169-004ffc17df90@serviceaccount"
            name  = "k8s-webteam-demos-default"
          }

          variable "demo_id" {
            description = "Unique identifier for this demo (e.g. my-repo-pr42)."
            type        = string
          }
          EOF

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEMOS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMOS_S3_SECRET_ACCESS_KEY }}
        run: terraform -chdir=terraform/demo init -backend-config="key=demos/${{ steps.demo-id.outputs.id }}/state"

      - name: Run Juju imports
        if: hashFiles('terraform/demo/juju_imports.sh') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DEMOS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMOS_S3_SECRET_ACCESS_KEY }}
          JUJU_CLIENT_ID: ${{ secrets.DEMOS_JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.DEMOS_JUJU_CLIENT_SECRET }}
          TF_VAR_demo_id: ${{ steps.demo-id.outputs.id }}
          DEMO_ID: ${{ steps.demo-id.outputs.id }}
          MODEL_UUID: "40cad239-1fe9-497f-89a2-ce70ab3e33af"
        run: bash terraform/demo/juju_imports.sh

      - name: Terraform apply
        env:
          JUJU_CLIENT_ID: ${{ secrets.DEMOS_JUJU_CLIENT_ID }}
          JUJU_CLIENT_SECRET: ${{ secrets.DEMOS_JUJU_CLIENT_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DEMOS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DEMOS_S3_SECRET_ACCESS_KEY }}
          TF_VAR_demo_id: ${{ steps.demo-id.outputs.id }}
        run: terraform -chdir=terraform/demo apply -auto-approve
      
      - name: Post demo comment
        uses: ./.github/actions/demo-comment
        with:
          demo-id: ${{ steps.demo-id.outputs.id }}
          status: deployed
